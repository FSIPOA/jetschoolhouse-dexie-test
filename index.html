<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jet Schoolhouse - Event Sync Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .status {
      border: 1px solid #999;
      padding: 15px;
      margin-top: 25px;
      border-radius: 8px;
    }

    button {
      padding: 10px 18px;
      margin: 5px;
      font-size: 16px;
    }

    .diagnostic {
      margin-top: 25px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h1>Jet Schoolhouse</h1>
  <h2>Dexie Cloud Event Sync Test - Prototype 2</h2>

  <p><strong>Pilot:</strong> Joe</p>

  <div class="status">
    <p><strong>Sequential Review</strong></p>
    <p>Current Question: <span id="question">1</span> of 10</p>
    <p>Effective Attempts: <span id="attempts">0</span></p>
  </div>

  <p>
    <button id="correctButton">Correct Answer</button>
    <button id="wrongButton">Wrong Answer</button>
  </p>

  <p id="message">Connecting to Dexie...</p>

  <div class="diagnostic">
    <p><strong>Device ID:</strong> <span id="deviceId"></span></p>
  </div>

  <script type="module">
    import Dexie from "dexie";
    import dexieCloud from "dexie-cloud-addon";

    const DEVICE_ID_KEY = "jetschoolhouse_event_test_device_id";

    function getDeviceId() {
      let deviceId = localStorage.getItem(DEVICE_ID_KEY);

      if (!deviceId) {
        deviceId = crypto.randomUUID();
        localStorage.setItem(DEVICE_ID_KEY, deviceId);
      }

      return deviceId;
    }

    const deviceId = getDeviceId();

    let displayedQuestion = 1;

    const db = new Dexie("JetSchoolhouseQuestionEventSyncTest", {
      addons: [dexieCloud]
    });

    db.version(1).stores({
      questionAnswerEvents: "id"
    });

    db.cloud.configure({
      databaseUrl: "https://zenj0t5lt.dexie.cloud",
      requireAuth: true
    });

    async function getEvents() {
      return await db.questionAnswerEvents.toArray();
    }

    function getEffectiveAnswers(events) {
      const effective = new Map();

      for (const event of events) {
        if (typeof event.questionNumber !== "number") {
          continue;
        }

        const existing = effective.get(event.questionNumber);

        if (!existing || event.timestamp > existing.timestamp) {
          effective.set(event.questionNumber, event);
        }
      }

      return effective;
    }

    async function getDerivedState() {
      const events = await getEvents();
      const effectiveAnswers = getEffectiveAnswers(events);

      const answeredQuestions = [...effectiveAnswers.keys()]
        .sort((a, b) => a - b);

      let currentQuestion = 1;

      while (
        currentQuestion <= 10 &&
        effectiveAnswers.has(currentQuestion)
      ) {
        currentQuestion++;
      }

      if (currentQuestion > 10) {
        currentQuestion = 10;
      }

      return {
        events,
        effectiveAnswers,
        answeredQuestions,
        currentQuestion,
        effectiveAttempts: effectiveAnswers.size
      };
    }

    async function refreshScreen() {
      const state = await getDerivedState();

      displayedQuestion = state.currentQuestion;

      document.getElementById("question").textContent =
        displayedQuestion;

      document.getElementById("attempts").textContent =
        state.effectiveAttempts;

      document.getElementById("deviceId").textContent =
        deviceId;

      document.getElementById("message").textContent =
        "Dexie database ready.";
    }

    async function recordAnswer(correct) {
      const questionBeingAnswered = displayedQuestion;

      const event = {
        id: crypto.randomUUID(),
        deviceId: deviceId,
        questionNumber: questionBeingAnswered,
        correct: correct,
        timestamp: Date.now()
      };

      await db.questionAnswerEvents.add(event);

      document.getElementById("message").textContent =
        correct
          ? "Correct answer event recorded."
          : "Wrong answer event recorded.";

      await refreshScreen();
    }

    document.getElementById("correctButton")
      .addEventListener("click", () => recordAnswer(true));

    document.getElementById("wrongButton")
      .addEventListener("click", () => recordAnswer(false));

    await refreshScreen();
  </script>
</body>
</html>
