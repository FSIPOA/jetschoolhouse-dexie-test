<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jet Schoolhouse - Reset Sync Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .status {
      border: 1px solid #999;
      padding: 15px;
      margin-top: 25px;
      border-radius: 8px;
    }

    button {
      padding: 10px 18px;
      margin: 5px;
      font-size: 16px;
    }

    .diagnostic {
      margin-top: 25px;
      font-size: 14px;
    }
  </style>
  <script type="module" crossorigin src="/jetschoolhouse-dexie-test/assets/index-CS40tEUn.js"></script>
</head>

<body>
  <h1>Jet Schoolhouse</h1>
  <h2>Dexie Cloud Real Sequential Pass Test - Prototype 4</h2>

  <p><strong>Pilot:</strong> Joe</p>

  <div class="status">
    <p><strong>Sequential Review</strong></p>
    <p>Current Position: <span id="question">1</span> of 10</p>
    <p>Resolved Questions: <span id="attempts">0</span></p>
    <p>Question State: <span id="questionState">Unanswered</span></p>
    <p>Attempts on This Question: <span id="questionAttempts">0</span></p>
  </div>

  <p>
    <button id="correctButton">Correct Answer</button>
    <button id="wrongButton">Wrong Answer</button>
    <button id="nextButton" style="display:none;">Next Question</button>
    <button id="startOverButton">Start Over</button>
  </p>

  <p id="message">Connecting to Dexie...</p>

  <div class="diagnostic">
    <p><strong>Device ID:</strong> <span id="deviceId"></span></p>
    <p><strong>Active Review ID:</strong> <span id="reviewId"></span></p>
    <p><strong>Question ID:</strong> <span id="questionId"></span></p>
  </div>

</body>
</html>
